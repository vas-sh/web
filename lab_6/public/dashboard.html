<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Платформа керування енергією дата-центру</h1>

    <section class="card">
      <h2>Поточний користувач</h2>
      <p id="userInfo">Завантаження...</p>
      <button id="logoutBtn">Вийти</button>
    </section>

    <section class="card">
      <h2>API операції</h2>

      <button id="pueBtn">GET PUE / DCiE</button>
      <button id="loadBalanceBtn">Load balance servers</button>
      <button id="coolingBtn">Optimize cooling</button>
      <button id="reportsBtn">Efficiency reports</button>
    </section>

    <section class="card">
      <h2>Результат</h2>
      <pre id="result">---</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
