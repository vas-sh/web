<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Реєстрація</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Реєстрація</h1>

    <form id="registerForm" class="card">
      <label>
        Ім'я
        <input name="name" required />
      </label>

      <label>
        Email
        <input name="email" type="email" required />
      </label>

      <label>
        Пароль
        <input name="password" type="password" minlength="8" required />
      </label>

      <label>
        Роль
        <select name="role" required>
          <option value="it_operator">IT оператор</option>
          <option value="energy_specialist">Енергетик</option>
          <option value="dc_manager">Менеджер дата-центру</option>
        </select>
      </label>

      <button type="submit">Зареєструватися</button>
    </form>

    <p>Вже є акаунт? <a href="/login.html">Увійти</a></p>
    <p id="message"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
