<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компенсація реактивної потужності</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <header class="header">
    <h1>⚡ Компенсація реактивної потужності</h1>
    <p>Розрахунок параметрів конденсаторної установки та економії</p>
  </header>

  <main class="main">

    <section class="card">
      <h2>Введення даних</h2>

      <form id="form" class="form">

        <div class="form-group">
          <label>Об'єкт</label>
          <input name="name" placeholder="Наприклад: Завод №1" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Потужність (кВт)</label>
            <input name="power" type="number" required>
          </div>

          <div class="form-group">
            <label>cos φ</label>
            <input name="cosPhi" type="number" step="0.01" min="0" max="1" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">Розрахувати</button>

      </form>
    </section>

    <section class="card">
      <h2>Результати розрахунків</h2>
      <div id="list" class="list"></div>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
